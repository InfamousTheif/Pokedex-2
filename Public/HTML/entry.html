<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../CSS/home.css">
  <link rel="stylesheet" href="../CSS/entry.css">
  <link rel="icon" type="image/x-icon" href="../Images/pokeball-w.webp">
  <title>Dex Entry</title>
</head>
<body>
  <main>
    <div class="left-wrapper_div">
      <div class="entry-name_div">
        <h1 class="entry-name_h1">Froakie <sup>#656</sup></h1>
        <div class="type-wrapper_div">
          <img class="type_img" src="../type-icons/water.avif">
        </div>
      </div>

      <div class="pokemon-img_div">
        <img class="pokemon_img" src="../Images/656.png">
      </div>

      <div class="evolution-wrapper_div">
        <h2 class="evolution-wrapper_h2">Evolutions</h2>
        <div class="evolution-line_div">
          <div class="evolution_div">
            <div class="evolution-img_div">
              <img class="evolution_img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/656.png">
            </div>
            <p class="evolve-level">Level 16</p>
          </div>
          <div class="evolution_div">
            <div class="evolution-img_div">
              <img class="evolution_img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/657.png">
            </div>
            <p class="evolve-level">Level 36</p>
          </div>
          <div class="evolution_div">
            <div class="evolution-img_div">
              <img class="evolution_img" src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/658.png">
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
