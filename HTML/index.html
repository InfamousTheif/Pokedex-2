<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex-2</title>
  <link rel="stylesheet" href="../CSS/home.css">
</head>
<body>
  <header>

    <div class="header-dropdown_div">
      <label class="dropdown-region_label sr-only" for="dropdown-region">Region:</label>

      <select class="dropdown-region_select" id="dropdown-region">
        <option class="dropdown-region_option" selected>Kanto</option>
        <option class="dropdown-region_option">Jhoto</option>
        <option class="dropdown-region_option">Hoenn</option>
        <option class="dropdown-region_option">Sinnoh</option>
        <option class="dropdown-region_option">Unova</option>
        <option class="dropdown-region_option">Kalos</option>
        <option class="dropdown-region_option">Alola</option>
        <option class="dropdown-region_option">Galar</option>
        <option class="dropdown-region_option">Paldea</option>
        <option class="dropdown-region_option">Hisui</option>
      </select>
    </div>
    
    <div class="header-search_div">
      <input type="text" name="search-bar" class="search-bar" id="search-bar" aria-label="Search Pokemon" placeholder="Search Pikachu">
      <img class="search-icon" src="../Assets/Images/search-2903-removebg-preview.webp">
    </div>
    
    <div class="header-theme_div">
      <button class="theme-toggle" type="button"></button>
      <p class="theme-label">Dark mode</p>
    </div>
  </header>

  </main>

  </footer>
